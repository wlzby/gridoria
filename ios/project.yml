name: Gridoria
options:
  bundleIdPrefix: com.mawelly
  deploymentTarget:
    iOS: "15.0"
targets:
  Gridoria:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Gridoria
      - path: www
        buildPhase: resources
        type: folder
    info:
      path: Gridoria/Info.plist
      properties:
        CFBundleDisplayName: Gridoria
        CFBundleIdentifier: com.mawelly.gridoria.JGF9X5ACM5
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarHidden: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mawelly.gridoria.JGF9X5ACM5
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGNING_ALLOWED: NO
