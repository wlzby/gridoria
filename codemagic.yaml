workflows:
  # ═══════════════════════════════════════════════════════════════════════════
  # 📱 1. Appetize.io iOS Simulator Workflow (ÖNCE BURADAN TEST EDİN)
  # ═══════════════════════════════════════════════════════════════════════════
  ios-simulator-appetize:
    name: 1. Gridoria iOS Simulator (Appetize.io Test)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.mawelly.gridoria.JGF9X5ACM5"
        XCODE_SCHEME: "Gridoria"
    scripts:
      - name: Prepare Assets & Generate Xcode Project
        script: |
          cd ios
          mkdir -p www
          cp -r ../app/src/main/assets/www/* ./www/
          which xcodegen || brew install xcodegen || true
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Gridoria.xcodeproj || true

      - name: Build iOS Application for Simulator (Appetize.io)
        script: |
          cd ios
          xcodebuild build \
            -project Gridoria.xcodeproj \
            -scheme Gridoria \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Appetize.io Simulator ZIP
        script: |
          mkdir -p $CM_BUILD_DIR/output
          cd ios

          SIM_APP_PATH=$(find build-sim -name "Gridoria.app" | head -n 1)
          if [ -z "$SIM_APP_PATH" ]; then
            echo "❌ Gridoria.app not found in build-sim!"
            exit 1
          fi

          echo "Found Simulator App at: $SIM_APP_PATH"
          mkdir -p "$SIM_APP_PATH/www"
          cp -r www/* "$SIM_APP_PATH/www/" 2>/dev/null || true
          cp -r www/* "$SIM_APP_PATH/" 2>/dev/null || true

          SIM_DIR=$(dirname "$SIM_APP_PATH")
          SIM_NAME=$(basename "$SIM_APP_PATH")

          echo "Compressing $SIM_NAME into Gridoria_Simulator.zip for Appetize.io..."
          (cd "$SIM_DIR" && zip -y -r -9 "$CM_BUILD_DIR/output/Gridoria_Simulator.zip" "$SIM_NAME")

          echo "✅ Gridoria_Simulator.zip successfully created!"
          ls -lh "$CM_BUILD_DIR/output/Gridoria_Simulator.zip"

      - name: Optional Direct Upload to Appetize.io
        script: |
          if [ -n "$APPETIZE_API_TOKEN" ]; then
            echo "Uploading Gridoria_Simulator.zip to Appetize.io..."
            RESPONSE=$(curl -s https://$APPETIZE_API_TOKEN@api.appetize.io/v2/apps \
              -F "file=@$CM_BUILD_DIR/output/Gridoria_Simulator.zip" \
              -F "platform=ios")
            echo "Appetize response: $RESPONSE"
            PUBLIC_KEY=$(echo "$RESPONSE" | grep -o '"publicKey":"[^"]*' | cut -d'"' -f4)
            if [ -n "$PUBLIC_KEY" ]; then
              echo "=========================================================="
              echo "🚀 APPETIZE.IO CANLI TEST URL:"
              echo "https://appetize.io/app/$PUBLIC_KEY"
              echo "=========================================================="
            fi
          else
            echo "ℹ️ APPETIZE_API_TOKEN tanımlanmadı. 'Gridoria_Simulator.zip' dosyasını Codemagic Artifacts bölümünden indirip https://appetize.io/upload adresine yükleyebilirsiniz."
          fi

    artifacts:
      - output/*.zip
      - output/*.app

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 🍏 2. iOS TestFlight & App Store Workflow (TEST DOĞRULANINCA GÖNDERİN)
  # ═══════════════════════════════════════════════════════════════════════════
  ios-app-store:
    name: 2. Gridoria iOS TestFlight & App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mawelly.gridoria.JGF9X5ACM5
      vars:
        BUNDLE_ID: "com.mawelly.gridoria.JGF9X5ACM5"
        XCODE_SCHEME: "Gridoria"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare Assets & Generate Xcode Project
        script: |
          cd ios
          mkdir -p www
          cp -r ../app/src/main/assets/www/* ./www/
          which xcodegen || brew install xcodegen || true
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Gridoria.xcodeproj || true

      - name: Set Build Number & Configure Signing
        script: |
          cd ios
          # Ensure version is 1.0.1 and build number is at least 9 (Apple rejected build 8)
          BUILD_NUM=${BUILD_NUMBER:-9}
          if [ "$BUILD_NUM" -lt 9 ]; then
            BUILD_NUM=$((BUILD_NUM + 8))
          fi
          echo "Using CFBundleShortVersionString: 1.0.1"
          echo "Using CFBundleVersion: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" Gridoria/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Gridoria/Info.plist || true
          agvtool new-marketing-version "1.0.1" || true
          agvtool new-version -all $BUILD_NUM || true
          # Bind profiles and certificates stored in Codemagic Code signing identities
          xcode-project use-profiles --project Gridoria.xcodeproj

      - name: Build IPA for App Store & TestFlight
        script: |
          cd ios
          xcode-project build-ipa \
            --project "Gridoria.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/ios/ipa/*.ipa
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/*-iphoneos/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/*-iphoneos/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 🤖 3. Android Workflow (Builds Gridoria Android APK & AAB)
  # ═══════════════════════════════════════════════════════════════════════════
  android-workflow:
    name: 3. Gridoria Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Grant Gradle Execute Permission
        script: |
          chmod +x gradlew
      - name: Build Android Release APK & AAB
        script: |
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
