workflows:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🍎 iOS Workflow (Builds Gridoria iOS App & IPA)
  # ═══════════════════════════════════════════════════════════════════════════
  ios-workflow:
    name: Gridoria iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.mawelly.gridoria"
        XCODE_WORKSPACE: "ios/Gridoria.xcworkspace"
        XCODE_SCHEME: "Gridoria"
    scripts:
      - name: Prepare Assets & Generate Xcode Project
        script: |
          cd ios
          # Ensure www folder is fresh and synced from Android assets
          mkdir -p www
          cp -r ../app/src/main/assets/www/* ./www/
          brew install xcodegen || true
          xcodegen generate
      - name: Install CocoaPods Dependencies (AdMob SDK)
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS Application (Simulator for Appetize.io)
        script: |
          cd ios
          xcodebuild build \
            -workspace Gridoria.xcworkspace \
            -scheme Gridoria \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS Application for Real Devices (Sideloadly IPA)
        script: |
          cd ios
          xcodebuild build \
            -workspace Gridoria.xcworkspace \
            -scheme Gridoria \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Sideloadly IPA & Simulator Artifacts
        script: |
          mkdir -p $CM_BUILD_DIR/output
          cd ios

          # 1. Package Real Device IPA (for Sideloadly / AltStore)
          DEVICE_APP_PATH=$(find build-device -name "Gridoria.app" | head -n 1)
          if [ -n "$DEVICE_APP_PATH" ]; then
            echo "Packaging Real Device IPA from: $DEVICE_APP_PATH"
            mkdir -p "$DEVICE_APP_PATH/www"
            cp -r www/* "$DEVICE_APP_PATH/www/"
            cp -r www/* "$DEVICE_APP_PATH/"
            
            mkdir -p ipa_temp/Payload
            cp -r "$DEVICE_APP_PATH" ipa_temp/Payload/
            (cd ipa_temp && zip -r -9 "$CM_BUILD_DIR/output/Gridoria.ipa" Payload)
            rm -rf ipa_temp
          fi

          # 2. Package Simulator ZIP (for Appetize.io)
          SIM_APP_PATH=$(find build-sim -name "Gridoria.app" | head -n 1)
          if [ -n "$SIM_APP_PATH" ]; then
            echo "Packaging Simulator ZIP from: $SIM_APP_PATH"
            mkdir -p "$SIM_APP_PATH/www"
            cp -r www/* "$SIM_APP_PATH/www/"
            cp -r www/* "$SIM_APP_PATH/"
            SIM_DIR=$(dirname "$SIM_APP_PATH")
            SIM_NAME=$(basename "$SIM_APP_PATH")
            (cd "$SIM_DIR" && zip -r "$CM_BUILD_DIR/output/Gridoria_Simulator.zip" "$SIM_NAME")
            cp -r "$SIM_APP_PATH" "$CM_BUILD_DIR/output/"
          fi
    artifacts:
      - output/*.ipa
      - output/*.zip
      - output/*.app
    publishing:
      email:
        recipients:
          - user@example.com # Replace with your email to receive build notifications
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 🤖 Android Workflow (Builds Gridoria Android APK & AAB)
  # ═══════════════════════════════════════════════════════════════════════════
  android-workflow:
    name: Gridoria Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Grant Gradle Execute Permission
        script: |
          chmod +x gradlew
      - name: Build Android Release APK & AAB
        script: |
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
